{% set name = "gravity-toolkit" %}
{% set version = "1.2.5" %}
{% set sha256 = "0dda3392446d0fa3f7cb6711e19965695d4ee4fd875100a2a1314ab6038f699e" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gravity_toolkit-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - boto3
    - cartopy
    - future
    - geoid-toolkit
    - h5py
    - ipywidgets
    - ipympl
    - jupyterlab
    - jupyterlab_widgets
    - lxml
    - matplotlib-base
    - netcdf4
    - numpy
    - python >={{ python_min }}
    - python-dateutil
    - pyyaml
    - scipy >=1.10.1
    - setuptools
    - shapely

test:
  imports:
    - gravity_toolkit
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tsutterley/gravity-toolkit
  summary: Python tools for working time-variable gravity fields
  license: MIT
  license_file: LICENSE
  description: |
    Python tools for obtaining and working with spherical harmonic coefficients
    from the NASA/DLR GRACE and NASA/GFZ GRACE Follow-on missions
  doc_url: https://gravity-toolkit.readthedocs.io/
  dev_url: https://github.com/tsutterley/gravity-toolkit

extra:
  recipe-maintainers:
    - tsutterley
